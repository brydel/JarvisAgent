# JarvisAgent — configuration tmux
# Installée par install.sh (lien symbolique vers ~/.tmux.conf)

# --- Confort --------------------------------------------------------------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
# Agents Claude Code : pas de suggestion de prochaine commande (texte gris trompeur dans leur saisie)
set-environment -g CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION false
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Look « Stark » : noir + cyan -----------------------------------------
set -g status-position top
set -g status-style "bg=black fg=cyan"
set -g status-left "#[bold] JARVIS #[nobold]| "
set -g status-left-length 20
set -g status-right "#[fg=colour244]%H:%M "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=cyan"
set -g message-style "bg=black fg=cyan"
setw -g window-status-current-style "fg=black bg=cyan bold"

# --- Raccourcis agents (préfixe = Ctrl+B) ---------------------------------
# Ctrl+B puis Ctrl+S : tableau de bord de tous les agents
bind C-s display-popup -h 85% -w 90% -E "workmux dashboard"
# Ctrl+B puis Ctrl+T : barre latérale des statuts
bind C-t run-shell "workmux sidebar"
# Ctrl+B puis L : aller à l'agent qui vient de finir ou qui t'attend
bind L run-shell "workmux last-done"
# Ctrl+B puis Tab : basculer entre les deux derniers agents
bind Tab run-shell "workmux last-agent"

# Ctrl+B puis R : recharger cette configuration
bind r source-file ~/.tmux.conf \; display-message "Config tmux rechargée"

# JarvisAgent — catalogue des modèles utilisables par les agents.
#
# Le routeur (jarvis modele choisir) choisit dans ce catalogue selon le rôle, la taille de la
# tâche et la marge de jetons de chaque abonnement. Un modèle n'est utilisé qu'après un essai
# réussi avec ton abonnement (jarvis modele verifier) : un identifiant retiré ou absent de ton
# forfait est simplement ignoré, et le modèle par défaut du CLI prend le relais.
#
# Ne modifie pas ce fichier : tes ajustements vont dans ~/.config/jarvis/modeles.toml (même
# format, il complète et remplace celui-ci), ou passent par « jarvis modele proposer ».
#
# fournisseur  claude | codex
# id           valeur passée au CLI (--model). Vide = modèle par défaut du CLI, toujours valide.
# niveau       1 léger · 2 courant · 3 fort · 4 le plus fort
# cout         poids relatif sur l'abonnement (1 à 5) : à niveau égal, le moins coûteux gagne
# effort       effort de raisonnement par défaut (low, medium, high, xhigh), ajusté selon la taille
# repli        Claude uniquement : modèles de repli si le premier est indisponible ou surchargé
# atouts       rôles pour lesquels ce modèle est préféré (voir « jarvis role liste »)
#
# api_id       identifiant de l'API du fournisseur (pour le proxy des fonctions IA des produits, pas pour le CLI)
# prix_*       tarifs API publics en dollars US par million de jetons (entrée, sortie, lecture et
#              écriture du cache). Servent à « jarvis cout » : un ÉQUIVALENT API, pas ce que tu paies
#              avec tes abonnements. Absent = « estimation » (tarif de référence du fournisseur).
#
# Identifiants relevés dans la documentation officielle le 2026-10-13 :
#   Claude Code : alias de « claude --model » (fable, opus, sonnet, haiku)
#   Codex : https://developers.openai.com/codex/models
# Tarifs relevés le 2026-10-17 :
#   Claude : https://platform.claude.com/docs/models/fable-5-1 (tableau officiel entrée/sortie de tous
#            les modèles ; cache officiel pour Fable seulement, les autres caches en estimation)
#   Codex : tableau tiers (morphllm.com, d'après https://developers.openai.com/api/docs/pricing,
#           vérifié le 2026-10-15) : À REVÉRIFIER sur la page officielle

[modeles.fable]
fournisseur = "claude"
id = "fable"
niveau = 4
cout = 5
effort = "high"
repli = "opus,sonnet"
atouts = "architecte,securite,recherche,design"
note = "Le plus fort côté Claude : architecture, sécurité, décisions ambiguës, longues tâches."
prix_in = 10.0
prix_out = 50.0
prix_cache_lecture = 0.25
prix_cache_ecriture = 12.5
prix_source = "officiel : platform.claude.com/docs/models/fable-5-1"
prix_date = "2026-10-17"
api_id = "claude-fable-5-1"

[modeles.opus]
fournisseur = "claude"
id = "opus"
niveau = 3
cout = 4
effort = "high"
repli = "sonnet"

# Proxy LiteLLM pour les fonctions IA des PRODUITS (jamais pour les agents, qui sont sur abonnement).
# Désactivé : « jarvis proxy config » génère seulement sa configuration. Voir lib/jarvis/proxy.py.
[proxy]
actif = false
port = 4000
nouvelles_tentatives = 2
delai_s = 120

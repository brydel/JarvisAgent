note = "Fort : logique métier, conception d'interface, relecture exigeante."
prix_in = 4.0
prix_out = 20.0
prix_source = "officiel (entrée/sortie) : platform.claude.com/docs/models/fable-5-1"
prix_date = "2026-10-17"
api_id = "claude-opus-5-5"


# JarvisAgent — configuration globale workmux
# Installée par install.sh (lien symbolique vers ~/.config/workmux/config.yaml)
# Référence complète : `workmux config reference`

nerdfont: true
agent: cc
merge_strategy: rebase
window_prefix: "wm-"

# Profils d'agents utilisables avec `-a <nom>`. Les deux travaillent sans te solliciter, avec
# le modèle et l'effort choisis par le routeur pour leur tâche :
#  - Claude via bin/jarvis-claude : mode « auto » (un classifieur valide les actions sûres) ;
#  - Codex via bin/jarvis-codex : bac à sable + aucune demande + règles config/codex/jarvis.rules.
agents:
  cc:
    type: claude
    command: jarvis-claude
  cx:
    type: codex
    command: jarvis-codex

# Fichiers ignorés par git à recopier dans chaque nouveau worktree.
# Ne mets JAMAIS de secrets de production dans ces fichiers.
files:
  copy:
    - .env
    - .env.local
  symlink:
    - .claude/settings.local.json

# Disposition de chaque fenêtre : l'agent en haut, un terminal libre en bas
panes:
  - command: <agent>
    focus: true
  - split: horizontal
    size: 12

status_icons:
  working: "🤖"
  waiting: "💬"
  done: "✅"

<!doctype html>
<html lang="fr"><body>
<form id="inscription">
  <label for="email">Adresse électronique</label>
  <input id="email" type="email" required autocomplete="email">
  <label for="mdp">Mot de passe</label>
  <input id="mdp" type="password" required aria-describedby="erreur-mdp" autocomplete="new-password">
  <p id="erreur-mdp" class="erreur" role="alert"></p>
  <button type="submit">Créer mon compte</button>
</form>
</body></html>

titre = "Rendre le formulaire d'inscription accessible"
role = "frontend"
duree_max_min = 20
exigences_brief = ["accessibilit", "clavier"]
consigne = """
index.html contient un formulaire d'inscription inutilisable au lecteur d'écran. Chaque champ doit avoir un
libellé associé (label for=…), les champs email et mot de passe sont obligatoires (required), le message
d'erreur est relié au champ (aria-describedby) et le bouton est un vrai bouton d'envoi (type="submit").
Ne change pas les identifiants des champs.
"""

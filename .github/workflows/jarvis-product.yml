name: Jarvis product quality

on:
  push:
    branches: [codex/jarvis-product-studio, fix/board-agents-live]
  pull_request:
    paths: ['studio/**', 'lib/jarvis/**', 'services/model_bridge/**', 'services/workflows_temporal/**', 'tests/**', '.github/workflows/jarvis-product.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dependances verrouillees du Studio
        working-directory: studio/board-v2
        run: npm ci
      - name: Verifier TypeScript et construire le Studio
        working-directory: studio/board-v2
        run: npm run build
      - name: Verifier la syntaxe Python et shell
        run: |
          python -m compileall -q lib/jarvis services
          bash -n install.sh bin/jarvis
      - name: Tests du moteur, du Board, de l'atelier et de la passerelle
        run: |
          python -m unittest discover -s tests -p 'test_missions.py' -v
          python -m unittest discover -s tests -p 'test_board_v2.py' -v
          python -m unittest discover -s tests -p 'test_activite.py' -v
          python -m unittest discover -s tests -p 'test_contrats.py' -v
          python -m unittest discover -s tests -p 'test_mandats.py' -v
          python -m unittest discover -s tests -p 'test_capacites.py' -v
          python -m unittest discover -s tests -p 'test_os_runtime.py' -v
          python -m unittest discover -s tests -p 'test_durabilite.py' -v
          python -m unittest discover -s tests -p 'test_annulation_execution.py' -v
          python -m unittest discover -s tests -p 'test_communaute.py' -v
          python -m unittest discover -s tests -p 'test_communaute_runtime.py' -v
          python -m unittest discover -s tests -p 'test_outils.py' -v
          python -m unittest discover -s tests -p 'test_agent_runtime.py' -v
          python -m unittest discover -s tests -p 'test_pilotage.py' -v
          python -m unittest discover -s tests -p 'test_modeles_runtime.py' -v
          python -m unittest discover -s tests -p 'test_transport_runtime.py' -v
          python -m unittest discover -s tests -p 'test_mcp_stdio.py' -v
          python -m unittest discover -s tests -p 'test_stdio_integration.py' -v
          python -m unittest discover -s tests -p 'test_oauth.py' -v
          python -m unittest discover -s tests -p 'test_oauth_api.py' -v
          python -m unittest discover -s tests -p 'test_courriel.py' -v
          python -m unittest discover -s tests -p 'test_studio*.py' -v
          python -m unittest discover -s services/model_bridge/tests -v
      - name: Verifier le navigateur fourni par l'image GitHub
        run: google-chrome --version
      - name: Parcours produit et captures bureau/mobile
        working-directory: studio/board-v2
        env:
          JARVIS_TEST_BROWSER_CHANNEL: chrome
        run: npx playwright test product.spec.ts activite.spec.ts communaute.spec.ts integrations.spec.ts runtime.spec.ts
      - name: Conserver les preuves visuelles et les resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-product-evidence-${{ github.sha }}
          path: |
            reports/product-studio
            reports/board-v2/playwright-resultats.json
            reports/board-v2/playwright-sorties
          if-no-files-found: warn
          retention-days: 7

  temporal-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le SDK du service séparé
        run: python -m pip install -r services/workflows_temporal/requirements.txt
      - name: Vérifier contrat, contrôleur HTTP et sandbox du SDK
        env:
          PYTHONPATH: services/workflows_temporal
        run: python -m unittest discover -s services/workflows_temporal/tests -v
